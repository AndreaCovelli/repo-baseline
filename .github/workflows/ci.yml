name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs only: every push to main must report
  # Validate and seed the caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      # A local action needs the repository first; this dogfoods the actions
      # from this commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false

      - name: Check
        uses: ./.github/actions/check
        with:
          checkout: "false"
          paths: |
            .github/**
            baseline/**
            bin/**
            mise.toml
            mise.lock
            renovate.json
