name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # Dogfood the shared workflow from this commit.
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      paths: |
        .github/workflows/**
        baseline/**
        bin/**
        mise.toml
        mise.lock
        renovate.json

  validate:
    name: Validate
    needs: [check]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
