name: Repository check
description: >-
  Check out the repository, skip the work when no relevant path changed or when
  a push carries a tree that a pull request already validated, install the
  tools locked in mise.toml, and run one mise task. Use it as a step of the job
  that reports the required `Validate` check, so the check needs no gate job.
  The job needs contents, pull-requests, and checks read permissions.

inputs:
  paths:
    description: >-
      dorny/paths-filter patterns, one per line, that make the check relevant.
      Empty runs the check on every event.
    default: ""
  force:
    description: Run the check regardless of changed paths and earlier results (`true` or `false`)
    default: "false"
  reuse:
    description: >-
      Skip the task on a push to the default branch when a merged pull
      request's head has the same tree and passed `check-name` (`true` or `false`)
    default: "true"
  check-name:
    description: Required check whose earlier success lets a push skip the task
    default: Validate
  task:
    description: mise task that runs the repository checks
    default: check
  setup-task:
    description: mise task to run before the checks, e.g. to install locked dependencies
    default: ""
  install-args:
    description: Tools to install when not every tool in mise.toml is needed
    default: ""
  cache-path:
    description: Dependency cache directories, one per line; empty disables the cache
    default: ""
  cache-key-files:
    description: Glob patterns, one per line, whose contents key the dependency cache
    default: ""
  checkout:
    description: Check out the repository first (`false` when an earlier step already did)
    default: "true"
  github-token:
    description: Token for the API calls and the checks
    default: ${{ github.token }}

outputs:
  relevant:
    description: "`true` when the task ran"
    value: ${{ steps.decide.outputs.run }}
  reused:
    description: "`true` when a push skipped the task because a pull request already validated its tree"
    value: ${{ steps.decide.outputs.reused }}

runs:
  using: composite
  steps:
    - name: Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Pull requests list changed files through the API; push comparisons
        # need the previous commit without an authenticated fetch.
        fetch-depth: ${{ (inputs.paths != '' && github.event_name == 'push') && '0' || '1' }}
        persist-credentials: false

    # A force push discards the previous head, so there is nothing to compare
    # against: run every check instead, as for manual and scheduled runs.
    - name: Build path filter
      id: filter
      if: >-
        inputs.paths != '' &&
        inputs.force != 'true' &&
        !github.event.forced &&
        (github.event_name == 'pull_request' || github.event_name == 'push')
      shell: bash
      env:
        PATTERNS: ${{ inputs.paths }}
      run: |
        {
          echo 'yaml<<EOF_FILTER'
          echo 'relevant:'
          while IFS= read -r pattern; do
            pattern="${pattern#"${pattern%%[![:space:]]*}"}"
            pattern="${pattern%"${pattern##*[![:space:]]}"}"
            [[ -z "$pattern" || "$pattern" == \#* ]] && continue
            printf "  - '%s'\n" "${pattern//\'/\'\'}"
          done <<< "$PATTERNS"
          echo 'EOF_FILTER'
        } >> "$GITHUB_OUTPUT"

    - name: Detect relevant changes
      id: changes
      if: steps.filter.outcome == 'success'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        # Pull requests compare with their base branch; paths-filter warns if base is set.
        base: ${{ github.event_name == 'push' && github.ref || '' }}
        predicate-quantifier: some-with-excludes
        filters: ${{ steps.filter.outputs.yaml }}
        token: ${{ inputs.github-token }}

    - name: Look for an earlier validation
      id: earlier
      if: >-
        inputs.reuse == 'true' &&
        inputs.force != 'true' &&
        (steps.changes.outcome == 'skipped' || steps.changes.outputs.relevant == 'true') &&
        github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        !github.event.forced
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CHECK_NAME: ${{ inputs.check-name }}
      run: '"$GITHUB_ACTION_PATH/../tree-validated/tree-validated.sh"'

    - name: Decide whether to run
      id: decide
      shell: bash
      env:
        RELEVANT: ${{ steps.changes.outcome == 'skipped' || steps.changes.outputs.relevant == 'true' }}
        REUSED: ${{ steps.earlier.outputs.validated == 'true' }}
      run: |
        run=false
        if [[ "$RELEVANT" == true && "$REUSED" != true ]]; then
          run=true
        elif [[ "$RELEVANT" != true ]]; then
          echo "::notice::No relevant changes; skipping checks"
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"
        echo "reused=$REUSED" >> "$GITHUB_OUTPUT"

    # A reused push still installs the tools and seeds a missing dependency
    # cache: pull requests only read caches, so main must keep them warm.
    - name: Set up locked tools
      if: steps.decide.outputs.run == 'true' || steps.decide.outputs.reused == 'true'
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        version: 2026.10.14
        install_args: ${{ inputs.install-args }}
        cache_save: ${{ github.event_name != 'pull_request' }}
        github_token: ${{ inputs.github-token }}

    - name: Restore dependency cache
      id: cache
      if: >-
        inputs.cache-path != '' &&
        (steps.decide.outputs.run == 'true' || steps.decide.outputs.reused == 'true')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-path }}
        key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.cache-key-files) }}
        restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
        lookup-only: ${{ steps.decide.outputs.reused == 'true' }}

    - name: Run setup task
      id: setup
      if: >-
        inputs.setup-task != '' &&
        (steps.decide.outputs.run == 'true' ||
          (steps.decide.outputs.reused == 'true' && inputs.cache-path != '' && steps.cache.outputs.cache-hit != 'true'))
      shell: bash
      env:
        TASK: ${{ inputs.setup-task }}
      run: mise run "$TASK"

    - name: Run checks
      if: steps.decide.outputs.run == 'true'
      shell: bash
      env:
        TASK: ${{ inputs.task }}
        # Authenticated GitHub requests avoid the anonymous rate limit.
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: mise run "$TASK"

    # Only the default branch writes the cache, so pull requests cannot poison it.
    - name: Save dependency cache
      if: >-
        inputs.cache-path != '' &&
        github.event_name == 'push' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        steps.cache.outputs.cache-hit != 'true' &&
        (steps.decide.outputs.run == 'true' || steps.setup.outcome == 'success')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-path }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
